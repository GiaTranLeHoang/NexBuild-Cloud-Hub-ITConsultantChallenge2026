<!DOCTYPE html>
<html lang="en" class="overflow-x-hidden">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>NexBuild Warehouse Receiving Scanner</title>

    <!-- Typography: Plus Jakarta Sans with robust system fallback -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Design Tokens, Fluid Typography & Animations -->
    <style>
        :root {
            --font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            --color-concrete-surface: #f1f3f5;
            --color-concrete-card: #ffffff;
            --color-concrete-border: #e2e8f0;
            --color-ink-primary: #0f172a;
            --color-ink-secondary: #475569;
            --color-brand-accent: #ea580c;
            /* Industrial Safety Orange */
            --color-status-ok: #059669;
            --color-status-short: #d97706;
            --color-status-unknown: #dc2626;
        }

        html,
        body {
            font-family: var(--font-family);
            background-color: #0b111e;
            color: var(--color-ink-primary);
            overflow-x: hidden;
            max-width: 100vw;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Prevent wrapping inside PO numbers everywhere */
        .po-badge,
        .po-number {
            white-space: nowrap !important;
            word-break: keep-all !important;
        }

        /* Hero quantity typography: always the largest numbers on the screen */
        .hero-quantity {
            font-size: clamp(1.35rem, 2.5vw + 0.4rem, 1.85rem);
            line-height: 1.15;
        }

        /* Laser scanning sweep animation */
        @keyframes scanSweep {
            0% {
                top: 6%;
                opacity: 0.85;
            }

            50% {
                top: 92%;
                opacity: 1;
            }

            100% {
                top: 6%;
                opacity: 0.85;
            }
        }

        .scanner-beam {
            animation: scanSweep 1.8s ease-in-out infinite;
        }

        /* Slide-up bottom sheet animation */
        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }

            to {
                transform: translateY(0);
            }
        }

        .bottom-sheet-slide-up {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* SVG Checkmark drawing animation */
        @keyframes checkmarkDraw {
            0% {
                stroke-dashoffset: 48;
            }

            100% {
                stroke-dashoffset: 0;
            }
        }

        .animate-checkmark-draw {
            stroke-dasharray: 48;
            stroke-dashoffset: 48;
            animation: checkmarkDraw 0.35s ease-out forwards;
        }

        /* Floating ATP delta chip entrance */
        @keyframes floatUpFade {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-float-up {
            animation: floatUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Status badge pop animation */
        @keyframes popReview {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
            }

            100% {
                transform: scale(1);
            }
        }

        .animate-pop {
            animation: popReview 0.22s ease-out;
        }

        /* Dock Mode Overrides (High Contrast & Large Touch Targets) */
        .dock-mode {
            font-size: 1.12rem !important;
            background-color: #000000 !important;
            border-color: #ffffff !important;
        }

        .dock-mode button,
        .dock-mode [data-action="toggle-review"],
        .dock-mode #btn-trigger-scan,
        .dock-mode #btn-confirm-receipt {
            min-height: 56px !important;
            font-weight: 800 !important;
        }

        .dock-mode .hero-quantity {
            font-size: clamp(1.6rem, 3.2vw, 2.2rem) !important;
            color: #000000 !important;
        }

        /* Respect reduced-motion preferences */
        @media (prefers-reduced-motion: reduce) {

            .scanner-beam,
            .bottom-sheet-slide-up,
            .animate-checkmark-draw,
            .animate-float-up,
            .animate-pop {
                animation: none !important;
            }

            .animate-checkmark-draw {
                stroke-dashoffset: 0 !important;
            }

            * {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Mobile safe-area insets & scroll lock */
        .safe-bottom {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        .safe-top {
            padding-top: max(0.75rem, env(safe-area-inset-top));
        }

        .modal-open-scroll-lock {
            overflow: hidden !important;
            touch-action: none !important;
        }

        /* Custom scrollbar styling */
        .phone-viewport::-webkit-scrollbar {
            width: 5px;
        }

        .phone-viewport::-webkit-scrollbar-track {
            background: transparent;
        }

        .phone-viewport::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }

        .phone-viewport::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Visible keyboard focus for desktop accessibility */
        button:focus-visible,
        a:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible,
        [tabindex]:focus-visible {
            outline: 2px solid var(--color-brand-accent);
            outline-offset: 2px;
        }
    </style>
</head>

<body class="min-h-screen bg-slate-900 text-slate-900 overflow-x-hidden">

    <!-- Desktop Presentation Wrapper (Presenter chrome isolated to large screens >=1024px) -->
    <div
        class="demo-wrapper min-h-screen w-full flex items-start justify-center p-0 sm:p-4 lg:py-6 lg:px-6 gap-6 xl:gap-8 overflow-x-hidden">

        <!-- LEFT PRESENTER PANEL (Desktop >=1024px, read-only glanceable live demo guide) -->
        <aside id="desktop-guide-panel"
            class="hidden lg:flex flex-col w-[290px] xl:w-[330px] shrink-0 sticky top-6 self-start space-y-4"
            aria-live="polite">
            <!-- Injected dynamically by scanner_app.js -->
        </aside>

        <!-- CENTER MOBILE SCANNER CONTAINER (Strict Mobile Phone Dimensions & 100dvh Resilient Viewport) -->
        <div id="scanner-app"
            class="mobile-scanner-view w-full max-w-md min-h-[100dvh] h-[100dvh] sm:h-auto sm:min-h-[844px] sm:max-h-[890px] bg-slate-50 text-slate-900 sm:rounded-[36px] sm:shadow-2xl sm:border-2 sm:border-slate-800 flex flex-col relative overflow-hidden shrink-0 transition-all">

            <!-- Top Bar Component -->
            <div id="top-bar" class="shrink-0 safe-top"></div>

            <!-- Mobile Slim Caption Bar (Active when captions are enabled) -->
            <div id="mobile-caption-bar" class="shrink-0" aria-live="polite"></div>

            <!-- 3-Step Progress Indicator -->
            <div id="progress-bar" class="shrink-0"></div>

            <!-- Main Scrollable Content Viewport -->
            <main id="main-content" class="flex-1 overflow-y-auto phone-viewport flex flex-col bg-slate-100/70"></main>

            <!-- Sticky Bottom Bar Component (Thumb reach) -->
            <div id="bottom-bar" class="shrink-0"></div>

            <!-- Modal / Overflow Dropdown Mount -->
            <div id="menu-dropdown"></div>

            <!-- Bottom Sheet / Exception Modal Mount -->
            <div id="exception-modal"></div>

        </div>

        <!-- Hidden file input for real camera/file OCR upload (wired by scanner_app.js) -->
        <input type="file" id="ocrFileInput" accept="image/*" capture="environment" class="hidden">

        <!-- RIGHT PRESENTER PANEL (Desktop >=1024px, live event log timeline with data badges) -->
        <aside id="desktop-event-log-panel"
            class="hidden lg:flex flex-col w-[290px] xl:w-[330px] shrink-0 sticky top-6 self-start space-y-4"
            aria-live="polite">
            <!-- Injected dynamically by scanner_app.js -->
        </aside>

    </div>

    <!-- Modular Scripts: i18n & fx first, API client, then scanner app -->
    <script src="js/i18n.js"></script>
    <script src="js/fx.js"></script>
    <script src="js/api_client.js"></script>
    <script src="js/scanner_app.js"></script>

</body>

</html>
